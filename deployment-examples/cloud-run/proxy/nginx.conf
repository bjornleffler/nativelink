user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events { worker_connections 4096; }

# L4 TCP forwarding. Deliberately NOT the http block: gRPC rides long-lived
# HTTP/2 streams and an HTTP-aware proxy would interfere with them.
stream {
    # Re-resolve backends at runtime with a short TTL. Cloud Run worker pool
    # instance IPs change on every redeploy and on instance recycling, so
    # resolving once at startup would strand this proxy on a dead address.
    # The variable in proxy_pass is what forces per-request resolution.
    resolver 169.254.169.254 valid=30s ipv6=off;

    proxy_timeout 3600s;
    proxy_connect_timeout 10s;

    server {
        listen 8980;
        set $cas_backend "nativelink-cas.nl.internal:8080";
        proxy_pass $cas_backend;
    }

    server {
        listen 8981;
        set $sched_backend "nativelink-scheduler.nl.internal:8080";
        proxy_pass $sched_backend;
    }
}
